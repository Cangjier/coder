<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coder Design</title>
<style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --text: #1f2937;
  --muted: #667085;
  --border: #e4e7ec;
  --accent: #2563eb;
  --accent-soft: #eef4ff;
  --code: #f3f4f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --text: #e6e8eb;
    --muted: #9aa3af;
    --border: #2a3038;
    --accent: #7aa2ff;
    --accent-soft: #1b2436;
    --code: #1d232c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  line-height: 1.65;
  background: var(--bg);
  color: var(--text);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 14px 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; }
.mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  font-weight: 700;
}
.brand h1 { margin: 0; font-size: 17px; line-height: 1.2; }
.layout {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 32px;
  max-width: 1240px;
  margin: 0 auto;
  padding: 28px 24px 64px;
}
.sidebar {
  position: sticky;
  top: 84px;
  align-self: start;
  max-height: calc(100vh - 104px);
  overflow-y: auto;
  padding-right: 8px;
}
.nav-title {
  margin: 0 0 10px;
  padding: 0 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.toc { list-style: none; margin: 0; padding: 0; }
.toc ul {
  list-style: none;
  margin: 4px 0 10px 8px;
  padding-left: 10px;
  border-left: 1px solid var(--border);
}
.toc a {
  display: block;
  padding: 5px 8px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.toc a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
.toc > li > a { color: var(--text); font-weight: 600; }
.doc {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 32px;
  margin-bottom: 24px;
  overflow-wrap: anywhere;
  scroll-margin-top: 84px;
}
.doc > h2 {
  margin: 0 0 18px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--muted);
}
.markdown h1 { margin: 0 0 14px; font-size: 24px; line-height: 1.3; scroll-margin-top: 84px; }
.markdown h2 {
  margin: 26px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  font-size: 19px;
  scroll-margin-top: 84px;
}
.markdown h3 { margin: 20px 0 8px; font-size: 16px; }
.markdown p, .markdown ul, .markdown ol { margin: 10px 0; }
.markdown ul, .markdown ol { padding-left: 24px; }
.markdown li { margin: 4px 0; }
.markdown code {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--code);
  font-size: 0.9em;
}
.markdown pre {
  margin: 16px 0;
  padding: 16px;
  border-radius: 10px;
  background: var(--code);
  overflow: auto;
}
.markdown pre code { padding: 0; background: none; }
.markdown table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.markdown th, .markdown td { padding: 8px 10px; border: 1px solid var(--border); text-align: left; }
.markdown th { background: var(--code); }
.markdown blockquote {
  margin: 16px 0;
  padding: 8px 16px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  color: var(--muted);
}
.file-tree-wrap { overflow-x: auto; }
.file-tree { width: 100%; border-collapse: collapse; font-size: 14px; }
.file-tree th {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--muted);
  font-weight: 600;
}
.file-tree td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.file-tree tr:hover td { background: var(--accent-soft); }
.tree-path {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: nowrap;
}
.tree-guide {
  display: inline-block;
  width: 20px;
  height: 1.65em;
  border-left: 1px solid var(--border);
  vertical-align: middle;
}
.tree-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--muted);
  font: inherit;
  line-height: 1;
  cursor: pointer;
  vertical-align: middle;
}
.tree-toggle:hover { background: var(--accent-soft); color: var(--accent); }
.tree-path-toggle { cursor: pointer; }
.tree-mark { display: inline-block; width: 20px; color: var(--muted); vertical-align: middle; }
.tree-name { color: var(--text); }
.tree-name.dir { font-weight: 600; }
.tree-name.glob { color: var(--accent); }
.tree-desc { color: var(--muted); }
.doc-missing {
  min-height: 56px;
  border: 1px dashed var(--border);
  border-radius: 10px;
}
.mermaid { display: flex; justify-content: center; margin: 18px 0; overflow-x: auto; }
.mermaid svg { max-width: 100%; height: auto; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
  .sidebar { position: static; max-height: none; order: -1; }
  .doc { padding: 20px; }
  .topbar { padding: 12px 16px; }
}
@media print {
  .topbar, .sidebar { display: none; }
  .layout { display: block; padding: 0; }
  .doc { border: none; padding: 0; }
  .mermaid { break-inside: avoid; }
}
</style>
</head>

<script type="application/json" id="coder-data">{"docs":[{"path":".coder/design/file.md","kind":"file","present":true,"content":"# index.js\n插件入口：导出 name、inject 与 apply，注册 `list`、`render`、`lock`、`unlock`、`update` 工具。\n# package.json\n包清单：声明 coder bundle、导出文件与测试脚本。\n# cordis.patch.yml\nbundle 补丁：插入 id 为 coder 的 Host 插件行。\n# README.md\n插件说明：检查目标、使用方式与固化约定。\n# icon.svg\n插件图标：文档与勾选标记。\n# src\n源码目录。\n## src/docs.js\n文档扫描与格式诊断：扫描 .coder/ 文档树，比对预期文档，执行四份文档的确定性检查。\n## src/glob.js\n通配匹配：支持 *、**、? 的路径匹配与文件覆盖检查。\n## src/lock.js\n锁文件：lock.md 的格式解析、.coder hash 计算与读写。\n## src/git.js\nupdate 的 git 操作：提交指定文件、checkpoint 与新建分支。\n## src/render.js\nHTML 渲染：把四份文档写成单页 design.html。\n# src/tools\n工具定义目录。\n## src/tools/list.js\n`list` 工具：读取项目根目录、调用检查器、输出结构化报告与可读汇总。\n## src/tools/lock.js\n`lock` / `unlock` 工具：写入或删除 lock.md，处理授权原文。\n## src/tools/render.js\n`render` 工具：默认把 HTML 写到 dist/.coder/design.html。\n## src/tools/root.js\n所有工具共用的项目根目录解析。\n## src/tools/update.js\n`update` 工具：校验 tmp 源、上锁时分两步、替换并更新 hash，按 decision 提交。\n# tests\n测试目录。\n## tests/docs.test.js\n覆盖扫描、缺失、非法、文件覆盖与四份文档的格式诊断。\n## tests/glob.test.js\n覆盖 *、**、? 与 tmp/** 的匹配行为。\n## tests/plugin.test.js\n覆盖插件装配、工具注册与工具端到端调用。\n## tests/lock.test.js\n覆盖 lock/unlock、lock.md 格式、hash 比对与 list 诊断。\n## tests/render.test.js\n覆盖 HTML 生成、默认输出路径、缺失文档与确定性。\n## tests/update.test.js\n覆盖未上锁替换、上锁两步、key/review、补充提交、调整分支与 hash 校验。\n# docs\n插件设计文档目录。\n## docs/design.md\ncoder 的设计说明：文档约定、list/render 行为与格式规则。\n# locale\n显示文案目录。\n## locale/en.json\n英文标题与描述。\n## locale/zh.json\n中文标题与描述。\n# dist/**\n渲染输出目录及生成文件。\n# tmp/**\nupdate 的源文件暂存目录。\n# .git/**\ngit 元数据目录。\n"},{"path":".coder/design/architecture.md","kind":"architecture","present":true,"content":"# 架构\n## 全局视角\n从 Host 的 tools 服务到两个工具，再向下经过扫描层和诊断层；file.md 的通配覆盖项目文件，render 复用扫描结果生成 HTML。\n\n```mermaid\nflowchart TB\n  subgraph 宿主层\n    cordis[\"Cordis 上下文\"]\n    tools[\"tools 服务\"]\n  end\n  subgraph 工具层\n    list[\"list 工具\"]\n    render[\"render 工具\"]\n    lock[\"lock 工具\"]\n    unlock[\"unlock 工具\"]\n    update[\"update 工具\"]\n  end\n  subgraph 扫描层\n    walk[\"目录遍历\"]\n    parse[\"Markdown 解析\"]\n  end\n  subgraph 诊断层\n    file[\"file.md 校验\"]\n    glob[\"通配匹配\"]\n    arch[\"architecture.md 校验\"]\n    flow[\"flow.md 校验\"]\n    data[\"data_structure.md 校验\"]\n    lockHash[\"lock.md hash 校验\"]\n    report[\"报告汇总\"]\n  end\n  subgraph 锁层\n    lockFile[\"lock.md\"]\n    hash[\"hash 计算\"]\n  end\n  subgraph 提交层\n    git[\"git commit / 分支\"]\n  end\n  宿主层 --> 工具层\n  工具层 --> 扫描层\n  工具层 --> 锁层\n  工具层 --> 提交层\n  扫描层 --> 诊断层\n  锁层 --> 诊断层\n```\n\n## 局部视角：文档扫描\n只回答「怎么发现文件、怎么比对预期文档」，不重复全局图的层。\n\n```mermaid\nflowchart LR\n  A[解析 root] --> B[读取 .coder]\n  B --> C[递归遍历]\n  C --> D[相对路径集合]\n  D --> E[比对预期文档]\n  E --> F[缺失 / 非法]\n```\n\n## 局部视角：文件覆盖\n只回答「file.md 是否覆盖项目里的每个文件」，`.coder` 自身除外。\n\n```mermaid\nflowchart LR\n  A[读取 file.md 路径] --> B[列出项目文件]\n  B --> C[排除 .coder]\n  C --> D[通配匹配]\n  D --> E[未覆盖文件]\n```\n\n## 局部视角：数据结构\n只回答「data_structure.md 如何被校验」：按 `##` 分段，每段读取 ts 围栏，提取 interface 名称并查重。\n\n```mermaid\nflowchart LR\n  A[读取 data_structure.md] --> B[按 ## 分段]\n  B --> C[收集 ts 围栏]\n  C --> D[提取 interface]\n  D --> E[空块 / 缺 interface / 重名]\n```\n\n## 局部视角：锁定与更新\n只回答「lock 如何约束修改、update 如何放行修改」；hash 计算复用全局图的锁层。\n\n```mermaid\nflowchart LR\n  A[lock] --> B[计算 hash]\n  B --> C[写 lock.md]\n  D[update] --> E{已上锁?}\n  E -- 否 --> F[直接替换，不提交]\n  E -- 是 --> G{带 key?}\n  G -- 否 --> H[返回 key 和审查计划]\n  G -- 是 --> I[校验 hash / key / 源文件]\n  I --> J{decision}\n  J -- 补充 --> K[替换 + 更新 hash + 提交]\n  J -- 调整 --> L[checkpoint + 新分支 + 替换 + 提交]\n```\n\n## 局部视角：渲染\n只回答「render 如何把文档变成 HTML」，扫描和诊断复用全局图。\n\n```mermaid\nflowchart LR\n  A[render 调用] --> B[读取四份文档]\n  B --> C[汇总诊断]\n  C --> D[生成 HTML]\n  D --> E[写入 dist/.coder/design.html]\n```\n"},{"path":".coder/design/flow.md","kind":"flow","present":true,"content":"# 流程\n## 检查项目文档\n```mermaid\nflowchart TD\n  A[list 调用] --> B[解析 root]\n  B --> C[扫描 .coder/ 文档树]\n  C --> D[比对预期文档]\n  D --> E[逐份格式诊断]\n  E --> F[汇总报告]\n```\n## 检查文件覆盖\n用 file.md 的路径/通配检查项目里的每个文件。\n\n```mermaid\nflowchart LR\n  A[读取 file.md] --> B[列出项目文件]\n  B --> C[排除 .coder]\n  C --> D[逐项通配匹配]\n  D --> E[未覆盖文件]\n```\n## 加载插件\n```mermaid\nflowchart TD\n  A[加载 coder bundle] --> B[执行 apply]\n  B --> C[注册 list / render]\n  B --> D[注册 lock / unlock]\n  B --> E[注册 update]\n```\n## 检查数据结构\n按 `##` 分段检查 data_structure.md 的 ts 围栏和 interface 声明。\n\n```mermaid\nflowchart TD\n  A[读取 data_structure.md] --> B[按 ## 分段]\n  B --> C[收集 ts 围栏]\n  C --> D[提取 interface]\n  D --> E[记录诊断]\n```\n## 上锁\nlock 计算当前 .coder 的 hash，把声明、hash 和授权原文写进 lock.md。\n\n```mermaid\nflowchart TD\n  A[lock 调用] --> B[计算 .coder hash]\n  B --> C[写 .coder/lock.md]\n  C --> D[返回锁状态]\n```\n## 解锁\nunlock 校验授权原文，删除 lock.md；hash 不一致时仍然解锁并报告。\n\n```mermaid\nflowchart TD\n  A[unlock 调用] --> B[校验授权原文]\n  B --> C[删除 .coder/lock.md]\n  C --> D[返回 hashMatches]\n```\n## 更新设计\nupdate 从 tmp/ 读取源文件；上锁时先审查、再带 key 和 decision 执行。\n\n```mermaid\nflowchart TD\n  A[update 调用] --> B{已上锁?}\n  B -- 否 --> C[直接替换]\n  B -- 是 --> D{带 key?}\n  D -- 否 --> E[返回 key 和审查计划]\n  D -- 是 --> F[校验 hash / key / 源文件]\n  F --> G{decision}\n  G -- 补充 --> H[替换 + 更新 hash + 提交]\n  G -- 调整 --> I[checkpoint + 按 branch 新建分支 + 提交]\n```\n## 渲染设计文档\n把四份文档渲染成一个 HTML 页面。\n\n```mermaid\nflowchart LR\n  A[render 调用] --> B[读取 .coder/design]\n  B --> C[汇总诊断]\n  C --> D[生成 HTML]\n  D --> E[写入 dist/.coder]\n```\n"},{"path":".coder/design/data_structure.md","kind":"data","present":true,"content":"# 数据结构\n\n只记录跨模块传递的关键结构：诊断、文档条目、检查报告，以及渲染的输入与结果。解析器内部的行、围栏等中间结构留在代码里，由 `src/docs.js` 自己维护。\n\n## 诊断\n\n`list` 和 `render` 都返回诊断；每条诊断能定位到文档和行，并带一个稳定的规则代码。\n\n```ts\nexport type DiagnosticSeverity = 'error'\n\nexport interface Diagnostic {\n  /** 展示用文档路径，例如 .coder/design/file.md */\n  doc: string\n  /** 1-based 行号 */\n  line: number\n  /** 稳定规则代码，例如 file.coverage.missing */\n  rule: string\n  severity: DiagnosticSeverity\n  /** 给人看的原因与改法 */\n  message: string\n}\n```\n\n## 文档条目\n\n`.coder/` 下扫描到的每个文件都变成一条文档条目，预期、非法和缺失共用同一种形状。\n\n```ts\nexport type DocumentKind = 'file' | 'architecture' | 'flow' | 'data' | 'lock' | 'generic'\n\nexport type DocumentStatus = 'expected' | 'illegal' | 'missing' | 'lock'\n\nexport interface DocumentEntry {\n  /** 展示用路径，例如 .coder/design/flow.md */\n  path: string\n  /** 相对于 .coder/ 的路径，例如 design/flow.md */\n  relative: string\n  /** 绝对路径 */\n  absolute: string\n  status: DocumentStatus\n  /** 预期文档在磁盘上是否存在；非法文档为 true */\n  exists: boolean\n  kind: DocumentKind\n}\n```\n\n## 检查报告\n\n`list` 的返回值，也是 `render` 判断文档是否健康的依据。\n\n```ts\nexport interface Summary {\n  /** 预期文档总数 */\n  expected: number\n  /** 找到的预期文档数 */\n  found: number\n  /** 非法文档数 */\n  illegal: number\n  /** 缺失文档数 */\n  missing: number\n  /** 诊断条数 */\n  diagnostics: number\n  /** .coder/lock.md 是否存在 */\n  locked: boolean\n}\n\nexport interface Report {\n  /** 没有非法文档、缺失文档和诊断时为 true */\n  ok: boolean\n  /** 项目根目录的绝对路径 */\n  root: string\n  /** .coder/ 的绝对路径 */\n  docsRoot: string\n  docsRootExists: boolean\n  documents: DocumentEntry[]\n  /** 非法文档的展示用路径 */\n  illegal: string[]\n  /** 缺失文档的展示用路径 */\n  missing: string[]\n  diagnostics: Diagnostic[]\n  summary: Summary\n  /** 锁的状态；未上锁时为 null */\n  lock: LockReport | null\n  /** 可直接阅读的汇总文本 */\n  text: string\n}\n```\n\n## 渲染\n\n渲染只接收四份文档的正文，输出页面路径、字节数和当前的检查状态。\n\n```ts\nexport interface RenderDocument {\n  /** 展示用路径，例如 .coder/design/file.md */\n  path: string\n  kind: DocumentKind\n  /** 文档是否存在；缺失时正文为空串 */\n  present: boolean\n  content: string\n}\n\nexport interface RenderPayload {\n  docs: RenderDocument[]\n}\n\nexport interface RenderResult {\n  ok: boolean\n  /** design.html 的绝对路径 */\n  output: string\n  /** HTML 的 UTF-8 字节数 */\n  bytes: number\n  /** 渲染时文档是否齐全且格式正确 */\n  healthy: boolean\n  summary: Summary\n  missing: string[]\n  illegal: string[]\n  diagnostics: Diagnostic[]\n  text: string\n}\n```\n\n## 锁\n\n`.coder/lock.md` 是锁状态文件；第一行是固定声明，第二行是 hash，第三行起是授权原文。`list` 解析它并报告 hash 是否匹配。\n\n```ts\nexport interface LockFile {\n  /** 固定声明 */\n  declaration: string\n  /** 所有 .coder 文件（除 lock.md）内容 hash 拼接后的 sha256 */\n  hash: string\n  /** 用户授权原文，逐字保存 */\n  authorization: string\n}\n\nexport interface LockReport {\n  present: boolean\n  /** 第一行是否为固定声明 */\n  declarationValid: boolean\n  /** 第二行记录的 hash */\n  hash: string | null\n  /** 重新计算的 hash 是否与记录一致；无法计算时为 null */\n  hashMatches: boolean | null\n  /** 当前 .coder 的 hash */\n  currentHash: string | null\n  /** 授权原文的长度，不返回原文本身 */\n  authorizationLength: number\n}\n```\n\n## 更新\n\n`update` 的输入是一组「tmp 源文件 → .coder 目标文件」；上锁时第一次调用只返回 key 和计划，第二次调用才替换。\n\n```ts\nexport interface UpdateItem {\n  /** tmp/ 下的源文件，相对项目根目录 */\n  source: string\n  /** .coder 下的目标文件 */\n  target: string\n}\n\nexport interface UpdateRequest {\n  locked: boolean\n  /** 第一次调用返回的随机 key，仅当前进程内存有效 */\n  key?: string\n  phase?: 'review'\n  files: UpdateItem[]\n}\n\nexport interface UpdateDecision {\n  /** 第一次调用返回的随机 key */\n  key: string\n  decision: 'supplement' | 'adjustment'\n  /** 本次更新的用户授权原文 */\n  review: string\n  /** adjustment 时传入的新建分支名 */\n  branch?: string\n}\n\nexport interface UpdateResult {\n  locked: boolean\n  decision?: 'supplement' | 'adjustment'\n  /** supplement 为当前分支；adjustment 为传入的新分支名 */\n  branch?: string\n  /** adjustment 分支前的 checkpoint commit；没有变化时为 null */\n  checkpoint?: string | null\n  /** 本次 update 的 commit；没有变化时为 null */\n  commit?: string | null\n  /** 更新后的锁 hash */\n  hash?: string\n  applied?: UpdateItem[]\n}\n```\n"}]}</script>
<script>
(function () {
  'use strict'
  var data = JSON.parse(document.getElementById('coder-data').textContent)
  var content = document.getElementById('content')
  var nav = document.getElementById('nav')
  var hasMarked = typeof window.marked !== 'undefined'
  var hasMermaid = typeof window.mermaid !== 'undefined'
  var newline = String.fromCharCode(10)
  var carriageReturn = String.fromCharCode(13)
  var tick = String.fromCharCode(96)

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]
    })
  }

  function parseHeading(line) {
    var level = 0
    while (level < line.length && line.charAt(level) === '#') level += 1
    if (level < 1 || level > 2) return null
    if (line.charAt(level) !== ' ') return null
    return { level: level, text: line.slice(level + 1).trim() }
  }

  function parseFileEntries(markdown) {
    var lines = markdown.split(newline)
    var entries = []
    var current = null
    for (var index = 0; index < lines.length; index += 1) {
      var line = lines[index]
      if (line.charAt(line.length - 1) === carriageReturn) line = line.slice(0, -1)
      var heading = parseHeading(line)
      if (heading !== null) {
        current = { level: heading.level, path: heading.text.split(tick).join('').trim(), description: [] }
        entries.push(current)
      } else if (current !== null && line.trim() !== '') {
        current.description.push(line.trim())
      }
    }
    return entries
      .filter(function (entry) {
        return entry.path !== '.coder' && entry.path.indexOf('.coder/') !== 0
      })
      .map(function (entry) {
        return { level: entry.level, path: entry.path, description: entry.description.join(' ') }
      })
  }

  function buildFileTree(entries) {
    var roots = []
    var byPath = {}
    var nextId = 0

    function createNode(name, nodePath, depth, parent) {
      var node = {
        id: 'node-' + nextId,
        parentId: parent === null ? '' : parent.id,
        name: name,
        path: nodePath,
        description: '',
        depth: depth,
        kind: 'file',
        children: [],
      }
      nextId += 1
      byPath[nodePath] = node
      if (parent === null) roots.push(node)
      else {
        parent.children.push(node)
        parent.kind = 'dir'
      }
      return node
    }

    entries.forEach(function (entry) {
      if (entry.path.indexOf('*') >= 0 || entry.path.indexOf('?') >= 0) {
        var glob = createNode(entry.path, entry.path, 0, null)
        glob.kind = 'glob'
        glob.description = entry.description
        return
      }
      var parts = entry.path.split('/')
      var parent = null
      var prefix = ''
      parts.forEach(function (part, index) {
        prefix = prefix === '' ? part : prefix + '/' + part
        var node = byPath[prefix]
        if (!node) node = createNode(part, prefix, index, parent)
        if (index === parts.length - 1) node.description = entry.description
        parent = node
      })
    })

    Object.keys(byPath).forEach(function (key) {
      if (byPath[key].children.length > 0) byPath[key].kind = 'dir'
    })
    return roots
  }

  function renderFileTree(markdown) {
    var table = document.createElement('table')
    table.className = 'file-tree'
    var thead = document.createElement('thead')
    var headRow = document.createElement('tr')
    var pathHead = document.createElement('th')
    pathHead.textContent = '路径'
    var descHead = document.createElement('th')
    descHead.textContent = '说明'
    headRow.appendChild(pathHead)
    headRow.appendChild(descHead)
    thead.appendChild(headRow)
    table.appendChild(thead)
    var tbody = document.createElement('tbody')

    function isHidden(row, collapsedIds) {
      var parentId = row.getAttribute('data-parent-id')
      while (parentId) {
        if (collapsedIds[parentId]) return true
        var parentRow = tbody.querySelector('tr[data-node-id="' + parentId + '"]')
        if (parentRow === null) break
        parentId = parentRow.getAttribute('data-parent-id')
      }
      return false
    }

    function refresh() {
      var rows = tbody.querySelectorAll('tr')
      var collapsedIds = {}
      Array.prototype.forEach.call(rows, function (row) {
        if (row.classList.contains('collapsed')) collapsedIds[row.getAttribute('data-node-id')] = true
      })
      Array.prototype.forEach.call(rows, function (row) {
        row.hidden = isHidden(row, collapsedIds)
      })
    }

    function appendRows(nodes) {
      nodes.forEach(function (node) {
        var row = document.createElement('tr')
        row.setAttribute('data-node-id', node.id)
        row.setAttribute('data-parent-id', node.parentId)
        var pathCell = document.createElement('td')
        pathCell.className = 'tree-path'
        for (var level = 0; level < node.depth; level += 1) {
          var guide = document.createElement('span')
          guide.className = 'tree-guide'
          pathCell.appendChild(guide)
        }
        if (node.kind === 'dir') {
          var toggle = document.createElement('button')
          toggle.type = 'button'
          toggle.className = 'tree-toggle'
          toggle.setAttribute('aria-expanded', 'true')
          toggle.setAttribute('aria-label', '展开或折叠 ' + node.path)
          toggle.textContent = '▾'
          var toggleRow = function () {
            var isCollapsed = row.classList.toggle('collapsed')
            toggle.textContent = isCollapsed ? '▸' : '▾'
            toggle.setAttribute('aria-expanded', String(!isCollapsed))
            refresh()
          }
          toggle.addEventListener('click', function (event) {
            event.stopPropagation()
            toggleRow()
          })
          pathCell.classList.add('tree-path-toggle')
          pathCell.addEventListener('click', function (event) {
            if (event.target === toggle) return
            toggleRow()
          })
          pathCell.appendChild(toggle)
        } else {
          var mark = document.createElement('span')
          mark.className = 'tree-mark'
          mark.textContent = node.kind === 'glob' ? '✧' : '·'
          pathCell.appendChild(mark)
        }
        var name = document.createElement('span')
        name.className = 'tree-name ' + node.kind
        name.textContent = node.name
        name.title = node.path
        pathCell.appendChild(name)
        var descCell = document.createElement('td')
        descCell.className = 'tree-desc'
        descCell.textContent = node.description
        row.appendChild(pathCell)
        row.appendChild(descCell)
        tbody.appendChild(row)
        if (node.children.length > 0) appendRows(node.children)
      })
    }

    appendRows(buildFileTree(parseFileEntries(markdown)))
    table.appendChild(tbody)
    var wrap = document.createElement('div')
    wrap.className = 'file-tree-wrap'
    wrap.appendChild(table)
    return wrap
  }

  data.docs.forEach(function (doc) {
    var section = document.createElement('section')
    section.className = 'doc'
    section.id = doc.kind
    var title = document.createElement('h2')
    title.textContent = doc.path
    section.appendChild(title)

    if (!doc.present) {
      var missing = document.createElement('div')
      missing.className = 'doc-missing'
      section.appendChild(missing)
    } else if (doc.kind === 'file') {
      section.appendChild(renderFileTree(doc.content))
    } else {
      var body = document.createElement('div')
      body.className = 'markdown'
      if (hasMarked) {
        try {
          body.innerHTML = window.marked.parse(doc.content, { gfm: true })
        } catch (error) {
          body.innerHTML = '<pre>' + escapeHtml(doc.content) + '</pre>'
        }
      } else {
        body.innerHTML = '<pre>' + escapeHtml(doc.content) + '</pre>'
      }
      section.appendChild(body)
    }
    content.appendChild(section)
  })

  function jumpTo(id) {
    var target = document.getElementById(id)
    if (target === null) return false
    var section = target.closest ? target.closest('.doc') : null
    if (section !== null) section.hidden = false
    var current = window.scrollY || document.documentElement.scrollTop || 0
    var top = Math.max(0, target.getBoundingClientRect().top + current - 84)
    if (window.scrollTo) window.scrollTo(0, top)
    else window.location.hash = id
    var after = window.scrollY || document.documentElement.scrollTop || 0
    if (Math.abs(after - current) < 2 && Math.abs(top - current) > 2 && section !== null) {
      Array.prototype.forEach.call(document.querySelectorAll('#content > .doc'), function (candidate) {
        candidate.hidden = candidate !== section
      })
    }
    try {
      if (window.history && window.history.replaceState) window.history.replaceState(null, '', '#' + id)
    } catch (error) {}
    return true
  }

  function bindJump(link, id) {
    link.href = '#' + id
    link.addEventListener('click', function (event) {
      if (jumpTo(id)) event.preventDefault()
    })
  }

  var toc = document.createElement('ul')
  toc.className = 'toc'
  data.docs.forEach(function (doc) {
    var item = document.createElement('li')
    var link = document.createElement('a')
    bindJump(link, doc.kind)
    link.textContent = doc.path
    item.appendChild(link)
    var section = document.getElementById(doc.kind)
    if (section !== null) {
      var headings = section.querySelectorAll('.markdown h1, .markdown h2')
      if (headings.length > 0) {
        var sublist = document.createElement('ul')
        Array.prototype.forEach.call(headings, function (heading, index) {
          heading.id = doc.kind + '-h-' + index
          var subItem = document.createElement('li')
          var subLink = document.createElement('a')
          bindJump(subLink, heading.id)
          subLink.textContent = heading.textContent
          subItem.appendChild(subLink)
          sublist.appendChild(subItem)
        })
        item.appendChild(sublist)
      }
    }
    toc.appendChild(item)
  })
  nav.appendChild(toc)

  if (hasMermaid) {
    var codes = document.querySelectorAll('code.language-mermaid')
    Array.prototype.forEach.call(codes, function (code) {
      var diagram = document.createElement('div')
      diagram.className = 'mermaid'
      diagram.textContent = code.textContent
      var pre = code.closest ? code.closest('pre') : null
      if (pre) pre.parentNode.replaceChild(diagram, pre)
      else code.parentNode.replaceChild(diagram, code)
    })
    var nodes = Array.prototype.slice.call(document.querySelectorAll('.mermaid'))
    if (nodes.length > 0) {
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      window.mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' })
      window.mermaid.run({ nodes: nodes }).catch(function () {})
    }
  }
})()
</script>
